[package]
name = "kitz"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Terminal UI for Kafka and AWS MSK: topics, messages and consumer lag at a glance, with IAM auth and multi-environment switching"
authors = ["Harry KP <harrykp@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/Harry-kp/kitz"
homepage = "https://github.com/Harry-kp/kitz"
documentation = "https://github.com/Harry-kp/kitz"
readme = "README.md"
keywords = ["kafka", "msk", "tui", "aws", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "kitz.toml", "*.png", "docs/", "assets/", "tapes/"]

[dependencies]
# Kafka - vendored librdkafka via cmake, with OpenSSL statically vendored
# (`ssl-vendored`) so the prebuilt binary is self-contained: npm/brew/curl
# installs need no system libs. MSK IAM (SASL OAUTHBEARER) comes with the ssl
# build; the `sasl` feature would only add Cyrus SASL (GSSAPI), which kitz
# doesn't use and which would make Linux binaries depend on libsasl2.
rdkafka = { version = "0.36", features = ["cmake-build", "ssl-vendored"] }

# AWS MSK IAM auth - the wedge. Generates the SigV4 SASL token.
aws-types = "1"
aws-msk-iam-sasl-signer = "1"
tokio = { version = "1", features = ["rt"] }

# TUI (palette borrowed from vortix)
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }  # Paragraph::line_count sizes the error modal

# CLI
clap = { version = "4", features = ["derive"] }

# Config + errors
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }  # pretty-print payloads, keys in original order
toml = "0.8"
anyhow = "1"
dirs = "7"
libc = "0.2"       # dup2: keep librdkafka stderr logs off the TUI

# The profile cargo-dist builds release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"
