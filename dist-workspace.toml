[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist). Regenerate CI with `dist init` after edits.
[dist]
cargo-dist-version = "0.30.3"
ci = "github"
# shell = curl|sh installer, homebrew tap, npm package.
installers = ["shell", "homebrew", "npm"]
tap = "Harry-kp/homebrew-tap"
npm-scope = "@harry-kp"
publish-jobs = ["homebrew", "npm"]
# macOS only for now (WIP). Prebuilt binaries are self-contained - librdkafka
# is statically linked (cmake-build) and OpenSSL is vendored (ssl-vendored), so
# end users installing via npm/brew/curl need no build or runtime deps.
# Linux/musl come later (librdkafka+OpenSSL cross-compile needs a C toolchain).
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
checksum = "sha256"
install-path = "CARGO_HOME"
install-updater = false
# librdkafka needs cmake on the build machine.
[dist.dependencies.homebrew]
cmake = "*"
[dist.dependencies.apt]
cmake = "*"
