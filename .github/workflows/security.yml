name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly audit

# audit-check posts results as a check run — needs checks:write, else it fails
# with "Resource not accessible by integration". Only real vulnerabilities fail
# the job; unmaintained/unsound advisories are informational warnings.
permissions:
  contents: read
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
