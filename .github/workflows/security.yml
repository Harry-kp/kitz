name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly audit

permissions:
  contents: read

jobs:
  audit:
    # Runs on Linux: `cargo audit` only reads Cargo.lock (no crate build), so
    # it doesn't hit the librdkafka/sasl Linux build issue. cargo-audit comes
    # from a prebuilt binary (taiki-e/install-action) — seconds, not a ~5min
    # source compile. Fails only on real vulnerabilities; unmaintained/unsound
    # advisories are informational.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-audit
      - run: cargo audit
