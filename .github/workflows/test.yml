name: test

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its older, now-pointless run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux runners start fast; macOS ones queue. librdkafka builds on Linux too
  # (see .cargo/config.toml), so PRs test on Linux only.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # macOS is the primary platform, so main still gets a macOS run before any
  # release is cut from it - just not on every PR push.
  test-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
