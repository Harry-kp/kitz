name: release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    # `cargo publish` compiles the crate to verify it; librdkafka builds on
    # Linux too (see .cargo/config.toml), and Linux runners start faster.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          # A PAT (not the default GITHUB_TOKEN) so the tag/commit release-plz
          # creates DOES trigger the cargo-dist release workflow. GITHUB_TOKEN
          # would suppress that (GitHub blocks recursive workflow triggering).
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
